{% set name = "ilpy" %}
{% set version = "0.6.1" %}
{% set python_min = "3.9" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: aabdbaad8e874086ccfbf15d34267651c38f99c6de5ac44f64c02351f89ff673

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - hatchling
    - hatch-vcs
  run:
    - python >={{ python_min }}
    - pyscipopt

test:
  imports:
    - ilpy
  requires:
    - pip
    - python {{ python_min }}
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert version('ilpy') == '{{ version }}'"

about:
  home: https://github.com/funkelab/ilpy
  summary: 'Unified API for ILP solvers.'
  license: MIT
  license_family: MIT
  license_file: LICENSE
  doc_url: https://funkelab.github.io/ilpy/
  dev_url: https://github.com/funkelab/ilpy

extra:
  recipe-maintainers:
    - tlambert03
